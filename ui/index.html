<style>
:root{
  --bg:#f5f6f8;
  --panel:#ffffff;
  --panel-hover:#f1f2f5;
  --border:#e4e7ec;
  --text:#1f2430;
  --text-dim:#6b7280;
  --accent:#6c5ce7;
  --accent-hover:#5b4bd6;
  --accent-soft:#efedfd;
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);}

/* ── Sidebar ── */
.sidebar{position:fixed;top:0;left:0;width:264px;height:100%;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10;}
.sidebar-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.logo-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;flex:none;}
.sidebar-header h1{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;color:var(--text);}
.section-label{padding:16px 20px 8px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--text-dim);}
.versions-section{flex:1;overflow-y:auto;}
.version-item{display:flex;align-items:center;gap:12px;padding:13px 20px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s;}
.version-item:hover{background:var(--panel-hover);}
.version-item.active{background:var(--accent-soft);}
.check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:.7rem;}
.version-item.active .check{border-color:var(--accent);background:var(--accent);color:#fff;}
.ver-label{font-weight:600;font-size:.93rem;color:var(--text);}
.ver-desc{font-size:.76rem;color:var(--text-dim);margin-top:2px;}
.sidebar-footer{padding:14px 20px 18px;border-top:1px solid var(--border);}
.version-select-label{display:block;font-size:.75rem;color:var(--text-dim);margin-bottom:6px;}
.version-select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);font-size:.9rem;cursor:pointer;}
.version-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,.15);}

/* ── Main ── */
.main{margin-left:264px;height:100vh;display:flex;flex-direction:column;}
.main-header{padding:14px 28px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.main-header h2{font-size:1.05rem;font-weight:600;color:var(--text);}
.action-btns{display:flex;gap:8px;}
.action-btns button{padding:8px 14px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);font-size:.85rem;cursor:pointer;transition:.15s;}
.action-btns button:hover{background:var(--panel-hover);}

/* ── Chat (centered frame) ── */
.messages-container{flex:1;overflow-y:auto;padding:28px 20px;}
.messages-inner{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
.msg{max-width:82%;padding:13px 18px;border-radius:var(--radius);line-height:1.6;font-size:.95rem;animation:msg-in .25s ease;}
@keyframes msg-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
.msg.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px;}
.msg-time{font-size:.72rem;color:var(--text-dim);margin-top:6px;}
.msg.user .msg-time{color:rgba(255,255,255,.75);}

/* ── Response box ── */
.response-shell{display:none;max-width:820px;margin:0 auto;padding:0 20px 4px;}
.response-header{display:flex;gap:10px;align-items:flex-start;}
.bot-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex:none;}
.response-content{flex:1;background:var(--panel);border:1.5px solid var(--accent);border-radius:var(--radius);padding:16px 20px;line-height:1.65;white-space:pre-wrap;font-size:.95rem;color:var(--text);}

/* ── Input ── */
.input-area{background:var(--panel);border-top:1px solid var(--border);padding:16px 20px 22px;}
.input-wrapper{max-width:820px;margin:0 auto;display:flex;gap:12px;align-items:flex-end;}
.input-wrapper textarea{flex:1;min-height:60px;max-height:170px;padding:13px 16px;border:1px solid var(--border);border-radius:var(--radius);background:#fafbfc;color:var(--text);font-size:.95rem;line-height:1.5;resize:none;font-family:inherit;}
.input-wrapper textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,.15);background:#fff;}
.send-btn{padding:13px 22px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;font-weight:600;font-size:.92rem;cursor:pointer;transition:.15s;}
.send-btn:hover:not(:disabled){background:var(--accent-hover);}
.send-btn:disabled{opacity:.45;cursor:not-allowed;}
.send-status{font-size:.8rem;color:var(--text-dim);min-height:20px;align-self:center;}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo-mark">K</div>
    <h1>Keep AI</h1>
  </div>
  <div class="section-label">Версии модели</div>
  <div class="versions-section" id="versionsList">
    <div class="version-item active" data-version="0">
      <div class="check">&#10003;</div>
      <div>
        <div class="ver-label">AI Model 1</div>
        <div class="ver-desc">OpenAI gpt-4o-mini &#183; v1.0</div>
      </div>
    </div>
    <div class="version-item" data-version="1">
      <div class="check">&#10003;</div>
      <div>
        <div class="ver-label">Test 0</div>
        <div class="ver-desc">Готовая к тестированию версия</div>
      </div>
    </div>
  </div>
  <div class="sidebar-footer">
    <label class="version-select-label" for="versionSelect">Модель</label>
    <select class="version-select" id="versionSelect">
      <option value="0" selected>AI Model 1</option>
      <option value="1">Test 0</option>
    </select>
  </div>
</aside>

<main class="main">
  <header class="main-header">
    <h2>Keep AI</h2>
    <div class="action-btns">
      <button id="newChatBtn">Новый диалог</button>
      <button id="clearChatBtn">Очистить</button>
    </div>
  </header>

  <div class="messages-container" id="messagesContainer">
    <div class="messages-inner" id="messagesInner">
      <div class="msg assistant">
        <div>Здравствуйте! &#x1F600; Я Keep AI. Выберите модель в левой панели и начните общение.</div>
        <div class="msg-time">Сейчас</div>
      </div>
    </div>
  </div>

  <div class="response-shell" id="responseShell">
    <div class="response-header">
      <div class="bot-avatar">AI</div>
      <div class="response-content" id="responseContent"></div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="inputText" placeholder="Введите сообщение&#8230; (Enter — отправить, Shift+Enter — новая строка)" rows="3"></textarea>
      <button class="send-btn" id="sendBtn">Отправить</button>
      <div class="send-status" id="sendStatus"></div>
    </div>
  </div>
</main>

<script>
/* ============================================================
   Keep AI — фронтенд (заготовка, AI подключается позже)
   ============================================================ */
const state = { version: 0, isThinking: false };
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function versionName() {
  return state.version === 0 ? 'AI Model 1' : 'Test 0';
}

function selectVersion(el) {
  $$('.version-item').forEach((e) => e.classList.remove('active'));
  el.classList.add('active');
  state.version = parseInt(el.dataset.version, 10);
  $('#versionSelect').value = String(state.version);
  console.log('Активная модель: ' + versionName());
}

$$('.version-item').forEach((el) => {
  el.addEventListener('click', () => selectVersion(el));
});

$('#versionSelect').addEventListener('change', (e) => {
  const idx = parseInt(e.target.value, 10);
  const item = document.querySelector('.version-item[data-version="' + idx + '"]');
  if (item) selectVersion(item);
});

/* ---------- Отправка сообщения ---------- */
$('#sendBtn').addEventListener('click', sendMessage);
$('#inputText').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

async function sendMessage() {
  const text = $('#inputText').value.trim();
  if (!text || state.isThinking) return;

  appendMessage(text, 'user', true);
  $('#inputText').value = '';
  $('#responseShell').style.display = 'none';

  state.isThinking = true;
  $('#sendBtn').disabled = true;
  $('#sendStatus').textContent = 'Отправка…';

  try {
    await saveMessage(text, 'user'); // TODO: Supabase insert
    const reply = await askAI(text);
    showResponse(reply);
  } catch (err) {
    console.error(err);
    showError('Не удалось получить ответ. Проверьте подключение.');
  } finally {
    state.isThinking = false;
    $('#sendBtn').disabled = false;
    $('#sendStatus').textContent = '';
  }
}

function appendMessage(text, role, withTime) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const body = document.createElement('div');
  body.textContent = text;
  wrap.appendChild(body);
  if (withTime) {
    const t = document.createElement('div');
    t.className = 'msg-time';
    t.textContent = 'Сейчас';
    wrap.appendChild(t);
  }
  $('#messagesInner').appendChild(wrap);
  $('#messagesContainer').scrollTop = $('#messagesContainer').scrollHeight;
}

/* ---------- AI (заглушка; интеграция — позже) ---------- */
/* ---------- AI: локальный сервер модели (scripts/chat_server.py) ---------- */
const AI_BASES = ['', 'http://127.0.0.1:8000']; // сначала same-origin, затем прямой адрес

async function askAI(prompt) {
  let data = null, lastErr = null;
  for (const base of AI_BASES) {
    try {
      const res = await fetch(base + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: prompt })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = await res.json();
      break;
    } catch (err) {
      lastErr = err; // попробуем следующий адрес
    }
  }
  if (!data) {
    console.error('AI server unreachable:', lastErr);
    return 'Сервер модели не запущен. Запустите: py -3 scripts/chat_server.py ' +
           'и откройте http://127.0.0.1:8000';
  }
  // память диалога: сохраняем обмен в localStorage
  try {
    const hist = JSON.parse(localStorage.getItem('keepai_history') || '[]');
    hist.push({ user: prompt, assistant: data.reply, ts: Date.now() });
    localStorage.setItem('keepai_history', JSON.stringify(hist.slice(-100)));
  } catch (e) { /* приватный режим — просто игнорируем */ }
  return data.reply;
}

function showResponse(text) {
  $('#responseShell').style.display = 'block';
  $('#responseContent').textContent = text;
  saveMessage(text, 'assistant'); // TODO: Supabase insert
}

function showError(msg) {
  $('#responseShell').style.display = 'block';
  $('#responseContent').innerHTML = '<span style="color:#dc2626;">&#x274C; ' + escapeHtml(msg) + '</span>';
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---------- Заглушки работы с Supabase ---------- */
async function saveMessage(content, role) {

  // const { error } = await supabase.from('messages').insert({
  //   conversation_id: currentConversationId,
  //   user_id: currentUserId,
  //   role: role,
  //   content: content
  // });
}

async function loadMessages() {

}

/* ---------- Кнопки шапки ---------- */
$('#newChatBtn').addEventListener('click', () => {
  if (!confirm('Создать новый диалог? Текущие сообщения будут удалены.')) return;
  resetChat('Диалог создан. Выберите модель в левой панели и начните общение.');
});

$('#clearChatBtn').addEventListener('click', () => {
  if (!confirm('Очистить текущий диалог?')) return;
  resetChat('Диалог очищен. Выберите модель в левой панели и начните общение.');
});

function resetChat(greeting) {
  $('#messagesInner').innerHTML = '';
  appendMessage(greeting, 'assistant', true);
  $('#responseShell').style.display = 'none';
  $('#inputText').value = '';
}
</script>
</body>
</html>
